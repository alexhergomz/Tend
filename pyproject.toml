[project]
name = "tend-cli"
version = "1.1.0"
description = "A calm task manager for the terminal: one task at a time, and why"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "alexhergomz" }]
keywords = ["tasks", "todo", "adhd", "productivity", "cli", "tui", "pomodoro", "planning", "gantt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = ["rich>=13", "python-dateutil>=2.8", "tzdata; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/alexhergomz/Tend"
Issues = "https://github.com/alexhergomz/Tend/issues"
Changelog = "https://github.com/alexhergomz/Tend/blob/main/CHANGELOG.md"

[project.scripts]
t = "tend.cli:main"
tend = "tend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[tool.hatch.build.targets.sdist]
include = ["src/tend", "tests", "docs/t.1", "docs/data.md", "README.md", "CHANGELOG.md", "ROADMAP.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "SIM108", "RUF001", "RUF002", "RUF003", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
