[project]
name = "tend-web"
version = "1.0.0"
description = "A calm local web UI for Tend, as a plugin: t web"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "alexhergomz" }]
keywords = ["tasks", "todo", "adhd", "productivity", "web", "tend"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
# The UI calls Tend's own Python code, so it moves in step with Tend's minor versions.
dependencies = ["tend-cli>=1.1,<1.3"]

[project.urls]
Homepage = "https://github.com/alexhergomz/Tend/tree/main/plugins/tend-web"

[project.scripts]
t-web = "tend_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend_web"]

[tool.uv.sources]
tend-cli = { workspace = true }
