[project]
name = "tend"
version = "0.8.0"
description = "Tend: a calm task and time manager for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "python-dateutil>=2.8"]

[project.scripts]
t = "tend.cli:main"
tend = "tend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[dependency-groups]
dev = ["pytest>=8"]
