[project]
name = "tend"
version = "0.8.0"
description = "Tend: a calm task and time manager for the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "python-dateutil>=2.8"]

[project.scripts]
t = "tend.cli:main"
tend = "tend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "SIM108", "RUF001", "RUF002", "RUF003", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
